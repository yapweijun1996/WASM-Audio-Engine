<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>Long WAV chunk validation</title>
  <label>Local WAV <input id="file" type="file" accept=".wav" /></label>
  <pre id="result">Select a local PCM16 WAV file</pre>
  <script type="module">
    import * as bindings from "../dist/wasm/wasm_audio_engine.js";
    import { createAudioEngine } from "../dist/index.js";
    const engine = await createAudioEngine(bindings);
    const result = document.querySelector("#result");
    document
      .querySelector("#file")
      .addEventListener("change", async (event) => {
        result.textContent = "RUNNING";
        try {
          const file = event.target.files[0];
          let count = 0,
            previousEnd = 0,
            previousTail,
            lastEnd = 0;
          const start = performance.now();
          for await (const chunk of engine.chunkWav(file, {
            chunkFrames: 2880000,
            overlapFrames: 48000,
          })) {
            if (
              chunk.sampleRate !== 48000 ||
              chunk.channels !== 2 ||
              chunk.audio.size !== 44 + (chunk.endFrame - chunk.startFrame) * 4
            )
              throw new Error("Invalid chunk metadata");
            if (count && chunk.startFrame !== previousEnd - 48000)
              throw new Error("Incorrect chunk overlap");
            const first = new Uint8Array(
              await chunk.audio.slice(44, 60).arrayBuffer(),
            );
            if (
              previousTail &&
              previousTail.some((byte, i) => byte !== first[i])
            )
              throw new Error("Overlapping audio differs");
            previousTail = new Uint8Array(
              await chunk.audio
                .slice(
                  chunk.audio.size - 48000 * 4,
                  chunk.audio.size - 48000 * 4 + 16,
                )
                .arrayBuffer(),
            );
            previousEnd = chunk.endFrame;
            lastEnd = chunk.endFrame;
            count++;
          }
          if (!count) throw new Error("No chunks generated");
          result.textContent = JSON.stringify({
            status: "PASS",
            elapsedMs: performance.now() - start,
            chunks: count,
            lastEnd,
          });
        } catch (error) {
          result.textContent = `FAIL: ${String(error)}`;
        }
      });
  </script>
</html>
