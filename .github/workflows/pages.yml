name: Deploy audio engine demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  RUST_VERSION: '1.99.1'
  WASM_BINDGEN_VERSION: '0.2.130'
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"

      - name: Cache Rust dependencies and builds
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}

      - name: Cache wasm-bindgen CLI
        id: wasm-bindgen-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: ${{ runner.os }}-wasm-bindgen-${{ env.WASM_BINDGEN_VERSION }}-rust-${{ env.RUST_VERSION }}

      - name: Install matching wasm-bindgen CLI
        if: steps.wasm-bindgen-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked

      - name: Install npm dependencies
        run: npm ci

      - name: Check source and tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --locked
          npm run format:check
          npm run typecheck
          npm test
          python3 scripts/generate_notices.py

      - name: Build WASM and static site
        run: |
          npm run build:wasm
          python3 scripts/build_site.py --revision "$GITHUB_SHA"
          python3 scripts/check_site.py _site --revision "$GITHUB_SHA"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
